<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1518">
<title>ChatGPT · Hub</title>
<link rel="stylesheet" href="https://adrianxds-ads.github.io/adrian-core/design/tokens.css">
<link rel="stylesheet" href="https://adrianxds-ads.github.io/adrian-core/components/base.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ad-bg);font-size:18px}.box{width:min(560px,100%);padding:24px}.k{font-size:13px;font-weight:950;letter-spacing:.12em;color:#F1DA9E}.box h1{font-size:34px;margin:8px 0 10px}.box p{color:var(--ad-text-muted);line-height:1.55}.actions{display:grid;gap:10px;margin-top:20px}.ad-button{min-height:52px;cursor:pointer}.primary{background:#E7BF57;color:#171208;border-color:#E7BF57}
</style>
</head>
<body>
<main class="box ad-card"><div class="k">ADRIÁN HUB · CHATGPT</div><h1 id="title">Abriendo proyecto Hub…</h1><p id="msg">Este puente permite que todas las apps usen un único enlace de ChatGPT.</p><div id="actions" class="actions"></div></main>
<script>
const KEY='adrian_chatgpt_hub_url';
let url='';try{url=localStorage.getItem(KEY)||'';}catch(e){}
const valid=/^https:\/\/chatgpt\.com\//i.test(url);
if(valid){document.getElementById('msg').textContent='JSON técnico copiado. Entrando en tu proyecto Hub de ChatGPT…';location.replace(url);}
else{
 document.getElementById('title').textContent='Vincula el proyecto Hub una sola vez';
 document.getElementById('msg').textContent='Abre tu proyecto Hub en ChatGPT, copia su URL y pégala aquí. Después, los botones JSON de todas tus apps pasarán siempre por este mismo acceso.';
 document.getElementById('actions').innerHTML='<button id="set" class="ad-button primary">PEGAR URL DEL PROYECTO HUB</button><a class="ad-button" href="https://chatgpt.com/" target="_blank" rel="noopener">ABRIR CHATGPT</a><a class="ad-button" href="./">VOLVER AL HUB</a>';
 document.getElementById('set').onclick=()=>{const v=prompt('Pega la URL exacta de tu proyecto Hub de ChatGPT','');if(v&&/^https:\/\/chatgpt\.com\//i.test(v)){try{localStorage.setItem(KEY,v);}catch(e){}location.replace(v);}else if(v!==null){alert('Necesito una URL de chatgpt.com.');}};
}
</script>
</body></html>

<main class="shell">
<header class="hero"><div class="mark">A</div><div><p class="eyebrow">ADRIÁN · HUB</p><h1>Todas tus apps.</h1><p class="intro">Un solo punto de entrada. Identidad visual compartida por Adrián Core.</p></div></header>
<section class="toolbar"><input id="search" type="search" placeholder="Buscar app…" autocomplete="off" data-ad-keyboard="es"><span id="count"></span></section>
<div id="groups"></div>
<section class="hub-secondary" aria-label="Herramientas secundarias">
<section class="hub-chat-panel ad-card"><div class="hub-chat-copy"><span>CHATGPT · PROYECTO HUB</span><b>Acceso y enlace del proyecto</b><small id="chatgptHubLinkStatus">Comprobando enlace…</small></div><div class="hub-chat-actions"><button id="openChatgptHubBtn" class="ad-button hub-chat-primary" type="button">ABRIR CHATGPT · HUB</button><button id="setChatgptHubUrlBtn" class="ad-button" type="button">VINCULAR PROYECTO</button><button id="copyHubTechBtn" class="ad-button" type="button">COPIAR JSON TÉCNICO</button></div></section>
<section class="garden-shell"><div class="garden-intro"><span>JUEGO VISUAL</span><b>Jardín GitHub</b><small>Tu ecosistema va creciendo poco a poco.</small></div><div id="githubGarden" data-adrian-garden data-mode="overview" data-navigate="true"></div></section>
</section>
<footer><span>Core</span><strong id="coreStatus">AVS 2.0 · Jardín GitHub 1.2</strong></footer>
</main>
